<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Retro Window Gradient -->
    <linearGradient id="winHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000080" />
      <stop offset="100%" stop-color="#1084d0" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    
    /* Dynamic Floating Elements Animation */
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @keyframes scanline {
      0% { transform: translateY(-320px); }
      100% { transform: translateY(320px); }
    }

    .floating-card-1 {
      animation: floatSlow 6s ease-in-out infinite;
    }
    
    .floating-card-2 {
      animation: floatSlow 8s ease-in-out infinite 1s;
    }

    .glow-circle {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      font-size: 42px;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      fill: #38bdf8;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      fill: #cbd5e1;
      font-size: 13px;
    }

    .retro-btn {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 1;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" class="bg" rx="16" />

  <!-- Grid Pattern Background -->
  <g class="grid">
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="320" class="grid-line" />
  </g>

  <!-- Ambient Animated Glowing Orbs in Background (behind text) -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" opacity="0.15" class="glow-circle" filter="blur(40px)" />
  <circle cx="1050" cy="220" r="160" fill="#818cf8" opacity="0.2" class="glow-circle" filter="blur(50px)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Positioned right/top to NEVER overlap text) -->
  <!-- Floating Retro Window Widget (Right side) -->
  <g class="floating-card-1" filter="url(#shadow)" transform="translate(840, 45)">
    <rect width="310" height="220" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <!-- Window Header -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 302 0 A 8 8 0 0 1 310 8 L 310 32 L 0 32 Z" fill="url(#winHeaderGrad)" />
    <text x="12" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">💾 C:\OS_LEGACY\PRESERVATION.EXE</text>
    <circle cx="272" cy="16" r="6" fill="#ef4444" />
    <circle cx="288" cy="16" r="6" fill="#eab308" />
    
    <!-- Window Content / OS List Snippet -->
    <rect x="12" y="44" width="286" height="30" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.05)" />
    <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="12">▶ Windows 95 / 98 / 3.1 [x86]</text>
    
    <rect x="12" y="82" width="286" height="30" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.05)" />
    <text x="24" y="102" fill="#a855f7" font-family="monospace" font-size="12">▶ Mac OS 8 / OS 9 [68k/PPC]</text>

    <rect x="12" y="120" width="286" height="30" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.05)" />
    <text x="24" y="140" fill="#22c55e" font-family="monospace" font-size="12">▶ OS/2 Warp &amp; BeOS [x86]</text>

    <rect x="12" y="158" width="286" height="46" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.05)" />
    <text x="24" y="178" fill="#e2e8f0" font-family="monospace" font-size="11">STATUS: 86Box &amp; v86 Ready</text>
    <text x="24" y="194" fill="#64748b" font-family="monospace" font-size="11">EMULATION: 100% ACCURATE</text>
  </g>

  <!-- Background Decorative Pills (Far Right / Bottom) -->
  <g class="floating-card-2" transform="translate(680, 220)">
    <rect width="140" height="36" rx="18" fill="url(#glassGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="20" y="23" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">🕹️ Retro Gaming</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Clear Foreground Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 50)">
      <rect width="240" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="16" y="20" class="subtitle-text" font-size="13" font-weight="700">💻 CURATED OS PRESERVATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">Awesome Desktop OS Legacy 🖥️</text>
    
    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle-text">Emulation, Historical Preservation &amp; Open-Source Alternatives</text>
    
    <!-- Description Paragraph -->
    <text x="0" y="205" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="400">
      Exploring classic operating systems: Windows 95/98, Mac OS, OS/2 Warp, AmigaOS, BeOS &amp; NeXTSTEP.
    </text>

    <!-- Badges Row in Banner -->
    <g transform="translate(0, 235)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="12" y="18" class="badge-text">📦 10+ Legacy OS</text>

      <!-- Badge 2 -->
      <rect x="140" y="0" width="150" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="152" y="18" class="badge-text">⚡ WebAssembly / JIT</text>

      <!-- Badge 3 -->
      <rect x="300" y="0" width="160" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="312" y="18" class="badge-text">🔓 Open-Source Engines</text>
    </g>
  </g>

</svg>
